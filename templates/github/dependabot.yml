# Copy to .github/dependabot.yml in your repository.
# Dependabot opens pull requests for security fixes and version updates.
# Review each one: an update is new code you did not write.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
